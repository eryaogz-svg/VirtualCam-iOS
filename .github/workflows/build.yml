name: Build VirtualCam IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project VirtualCam.xcodeproj \
            -scheme VirtualCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VirtualCam.app Payload/
          zip -r VirtualCam-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-unsigned-IPA
          path: VirtualCam-unsigned.ipa
